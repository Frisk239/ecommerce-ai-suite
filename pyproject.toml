# uv workspace 根（虚拟根，不打包）：
# 成员 = apps/api（FastAPI 单体）+ packages/platform（中台基础库）。
# 业务决策见 CONTEXT.md 与 docs/adr/；工程栈见 docs/adr/0011。

[tool.uv.workspace]
members = ["apps/api", "packages/platform"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/platform/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 起步用默认集（E/W/F 等基础错误），后续刀再按需收紧
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# B008：FastAPI 的 Depends() 参数默认值是该框架的标准写法
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["suite_api", "suite_platform"]
