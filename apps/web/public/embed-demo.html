<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>演示店铺 · 首页（嵌入宿主示例）</title>
    <style>
      /* 这是一个「商家自己的页面」的样子：与客服控制台毫无关系，只多了一行 <script>。 */
      body {
        margin: 0;
        background: #fff;
        color: #0f1115;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        padding: 14px 24px;
      }
      header b { font-size: 15px }
      header span { color: #81858c; font-size: 12px }
      main { max-width: 720px; margin: 0 auto; padding: 48px 24px }
      h1 { font-size: 26px; margin: 0 0 10px }
      p { color: #61666b; line-height: 1.7; margin: 0 0 18px }
      .card {
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 16px 18px;
        margin-top: 18px;
      }
      .card b { font-size: 14px }
      code { background: #ebeef2; border-radius: 4px; padding: 1px 5px; font-size: 12px }
      .note { font-size: 12px; color: #81858c; margin-top: 26px; line-height: 1.8 }
    </style>
  </head>
  <body>
    <header>
      <b>演示店铺</b>
      <span>这是一个「商家自己的页面」，右下角客服由一行脚本嵌入</span>
    </header>
    <main>
      <h1>钛钢保温杯 500ml</h1>
      <p>316 不锈钢内胆，早上灌的热水到下午还温着。有规格问题、退货流程问题，点右下角客服直接问。</p>

      <div class="card">
        <b>嵌入方式（就这一行）</b>
        <p style="margin: 8px 0 0">
          <code>&lt;script src="http://localhost:5173/embed.js"&gt;&lt;/script&gt;</code>
        </p>
      </div>

      <p class="note">
        客服面板是 iframe，样式与本站完全隔离；能否嵌入由<strong>控制台服务端白名单</strong>判定
        （<code>WIDGET_ALLOWED_ORIGINS</code>）：不在白名单的站点，客服页会拒绝建会话（403）。
      </p>
    </main>

    <!-- 商家页面唯一需要加的东西 -->
    <script src="/embed.js" data-label="在线客服"></script>
  </body>
</html>
