[project]
name = "suite-api"
version = "0.1.0"
description = "电商 AI 套件 FastAPI 单体（治理发布写回刀：登录/登记/机洗/人洗/发布）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "suite-platform",
    "mcp>=1.9.4,<2",
]

[tool.uv.sources]
suite-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suite_api"]
