[project]
name = "suite-api"
version = "0.1.0"
description = "电商 AI 套件 FastAPI 单体（治理发布写回刀：登录/登记/机洗/人洗/发布）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "suite-platform",
    "mcp>=1.10,<2",  # 1.10 起 Streamable HTTP 修复 CVE-2025-53365
    "openai>=1.60,<2",  # 厂商生成（第 7 刀）：官方包配 base_url，流式与错误语义成熟
    "prometheus-fastapi-instrumentator>=7.0",
    "structlog>=24.4",
]

[tool.uv.sources]
suite-platform = { workspace = true }

# 本地兜底转写（第 93 刀，ADR 0050）：**可选组，绝不进 api 运行时依赖与镜像**
# （Dockerfile 的 `uv sync --frozen --no-dev` 不带 --extra，不会装到它）。funasr
# 拖 torch（CPU 包 GB 级），转写 3–5 分钟录像按 RTF ~17x 也要数十秒——只服务
# `scripts/transcribe_local.py`（无云 key 时的脚本级兜底）。
# 安装：`uv sync --extra asr-local`（仓库根）。
[project.optional-dependencies]
asr-local = [
    "funasr>=1.2",
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suite_api"]
