# Alembic config, mounted at apps/api (script_location = ./migrations next to this file).
# NOTE: keep this file ASCII-only: alembic reads it with the locale encoding
# (GBK on Windows), and the app lifespan also loads it programmatically.
# The connection URL is NOT stored here: env.py resolves it from
# 1) programmatic injection (app startup), 2) env DATABASE_URL.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
