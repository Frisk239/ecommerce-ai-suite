# 电商 AI 套件 · 工程脚手架
# 用户路径：docker compose up -> http://localhost:5173 健康卡双绿。
# 本刀无业务：db 只装 pgvector 不用，api 只有 /health。

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: suite
      POSTGRES_PASSWORD: suite
      POSTGRES_DB: suite
    ports:
      - "${PG_PORT:-5432}:5432"  # 本机 5432 被占时 .env 设 PG_PORT 覆盖（默认不变）
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suite"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://suite:suite@db:5432/suite
      STORAGE_ROOT: /data/objects
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/go/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8-flash}
      # 云 ASR（第 93 刀，ADR 0050）：空 key = 不建客户端、不发请求（端点 409 诚实
      # 拒绝）。换 DashScope/本地网关改 ASR_BASE_URL/ASR_MODEL 即可（同 OpenAI 兼容形状）。
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-https://api.groq.com/openai/v1}
      ASR_MODEL: ${ASR_MODEL:-whisper-large-v3-turbo}
      # 云 VLM（第 94a 刀，ADR 0051）：看图出「图片描述」草稿（只出草稿，人确认
      # 才生效）。空 key = 不建客户端、不发请求——上传图片照常登记，人洗补写兜底。
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-https://api.openai.com/v1}
      VLM_MODEL: ${VLM_MODEL:-gpt-4o-mini}
      # 云文生图（第 98 刀，ADR 0055）：素材任务配图（OpenAI 兼容 images/generations，
      # 默认硅基流动免费 FLUX 档）。空 key = 不建客户端、不发请求——配图步诚实
      # 跳过（任务详情如实标注），纯文案套件照常。
      IMGGEN_API_KEY: ${IMGGEN_API_KEY:-}
      IMGGEN_BASE_URL: ${IMGGEN_BASE_URL:-https://api.siliconflow.cn/v1}
      IMGGEN_MODEL: ${IMGGEN_MODEL:-black-forest-labs/FLUX.1-schnell}
      # 云 TTS 口播（第 98b 刀，ADR 0056）：内容成片预览的口播音轨（OpenAI 兼容
      # audio/speech，默认硅基流动 CosyVoice2）。空 key = 不建客户端、不发请求
      # ——预览成片无音轨（with_tts=false，任务详情如实标注）；voice 用厂商
      # 预置音色（红线④：数字人/声音克隆 Out）。
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-https://api.siliconflow.cn/v1}
      TTS_MODEL: ${TTS_MODEL:-FunAudioLLM/CosyVoice2-0.5B}
      TTS_VOICE: ${TTS_VOICE:-FunAudioLLM/CosyVoice2-0.5B:alex}
      # 云 Embedding（第 105 刀，向量基础设施 A1）：切块语义坐标（OpenAI 兼容
      # embeddings，默认硅基流动 bge-m3 免费档 1024 维）。空 key = 不建客户端、
      # 不发请求——发布照常（块落库、embedding 留 NULL），词法检索主路不受影响；
      # 存量/漏网块由 scripts/realdata/backfill_embeddings.py 回填。
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      CUSTOMER_TRUST_PROXY: ${CUSTOMER_TRUST_PROXY:-}  # 空=直连模式忽略 XFF；反代部署设 true（settings 空串回落默认）
      # 可嵌入小组件的宿主白名单（第 45b 刀）：逗号分隔 origin，空=未启用嵌入。
      # 这里放演示宿主页（apps/web/public/embed-demo.html，与 web 同源）以便本地
      # 端到端验证；生产改成商家站点 origin。
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-http://localhost:5173}  # 演示默认放行本地宿主页；生产改成商家 origin，留空=未启用
      # 指标端点（第 47 刀）：/metrics 的独立 Bearer。空=端点一律 401（默认不裸奔）。
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # 日志级别（第 47 刀）：structlog JSON 输出到 stdout。
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./data/objects:/data/objects

  web:
    build: ./apps/web
    depends_on:
      - api
    environment:
      # 容器内 vite dev proxy 指向 compose 网络里的 api 服务；
      # 本地裸跑 npm run dev 时不设该变量，默认代理到 localhost:8000
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"

  # 可观测（第 47 刀）：可选抓取，**默认不启**——
  #   printf '%s' "$METRICS_TOKEN" > ops/metrics_token   # 与 api 同值（该文件已 gitignore）
  #   docker compose --profile metrics up
  # 令牌走文件：Prometheus 不展开配置文件里的 ${VAR}（实测），故不能用环境变量。
  # 没写该文件时抓取 401（端点 fail-closed）——这是刻意的：默认栈不裸奔指标。
  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: ["metrics"]
    depends_on:
      - api
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/metrics_token:/etc/prometheus/metrics_token:ro
    ports:
      - "9090:9090"

volumes:
  pgdata:
